<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logo-emblem-grad" x1="6" y1="6" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#6366F1" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="logo-text-grad" x1="120" y1="20" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#6366F1" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="logo-gold" x1="24" y1="36" x2="30" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="logo-glow" x="2" y="2" width="56" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Emblem Icon Box -->
  <g filter="url(#logo-glow)">
    <rect x="6" y="6" width="48" height="48" rx="14" fill="#0F172A" stroke="url(#logo-emblem-grad)" stroke-width="1.5" />
    
    <!-- Shield / Portal Contour -->
    <path d="M30 15L41 20V30C41 37.5 36 43.5 30 45.5C24 43.5 19 37.5 19 30V20L30 15Z" 
          stroke="url(#logo-emblem-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Wisdom Diamond Plane -->
    <path d="M30 20L37 24L30 28L23 24L30 20Z" 
          fill="#38BDF8" fill-opacity="0.35" stroke="url(#logo-emblem-grad)" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Flow Curves -->
    <path d="M24 31C26 30 28 30.5 30 32C32 30.5 34 30 36 31V35C34 34 32 34.5 30 36C28 34.5 26 34 24 35V31Z" 
          fill="url(#logo-emblem-grad)" fill-opacity="0.25" stroke="url(#logo-emblem-grad)" stroke-width="1.4" stroke-linejoin="round" />
    
    <!-- Intellect Spark -->
    <circle cx="30" cy="39.5" r="1.5" fill="url(#logo-gold)" />
  </g>

  <!-- Wordmark Text -->
  <text x="66" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
    Canvas<tspan fill="url(#logo-text-grad)">Flow</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="66.5" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#64748B" text-transform="uppercase">
    Academic Command
  </text>

  <!-- Pro / Multi-Tenant Badge -->
  <rect x="195" y="20" width="36" height="16" rx="4" fill="#6366F1" fill-opacity="0.1" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1" />
  <text x="213" y="31.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#6366F1" text-anchor="middle" letter-spacing="1">
    PRO
  </text>
</svg>
